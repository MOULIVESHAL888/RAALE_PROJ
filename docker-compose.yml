version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hospital_rightsizing_db
    environment:
      POSTGRES_USER: hospital_admin
      POSTGRES_PASSWORD: hospital_secret_password
      POSTGRES_DB: hospital_rightsizing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_admin -d hospital_rightsizing"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: hospital_rightsizing_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hospital_admin:hospital_secret_password@postgres:5432/hospital_rightsizing
      - DEFAULT_CPU_TARGET=75.0
      - DEFAULT_MEMORY_TARGET=80.0
      - DEFAULT_P95_LATENCY_TARGET=250.0
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: hospital_rightsizing_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
